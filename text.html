<!DOCTYPE html>
<html>
<body>
<button onclick="test()">TEST API</button>

<script>
async function test() {
  try {
    const res = await fetch("https://vitalcontrol-backend.onrender.com/analizar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        tema: "Evaluación inicial",
        usuario: { edad: 30, peso: 70, altura: 175, sexo: "M" },
        observaciones: "Siento leve fatiga por las tardes",
        inputMode: "datosPrimariosMasObservaciones",
        outputLevel: "basico"
      })
    });

    const data = await res.json();
    console.log("Respuesta de Render + Gemini:", data);
  } catch (error) {
    console.error("Error al conectar con Render:", error);
  }
}
</script>

</body>
</html>
